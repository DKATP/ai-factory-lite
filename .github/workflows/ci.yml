name: ci

# Gitflow: feature/* -> develop -> main. Every pull request runs the full gate; only a merge
# to develop or main is allowed to deploy, and the deploy target is derived from the branch,
# never passed by hand.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  quality:
    name: lint, types and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Format check (black)
        run: black --check src tests
      - name: Import order (isort)
        run: isort --check-only src tests
      - name: Static types (mypy, strict)
        run: mypy src
      - name: Tests
        run: pytest -q
