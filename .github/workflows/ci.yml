name: ci

# Gitflow: feature/* -> develop -> main. Every pull request runs the full gate; only a merge
# to develop or main is allowed to deploy, and the deploy target is derived from the branch,
# never passed by hand.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  quality:
    name: lint, types and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Format check (black)
        run: black --check src tests
      - name: Import order (isort)
        run: isort --check-only src tests
      - name: Static types (mypy, strict)
        run: mypy src
      - name: Tests
        run: pytest -q

  bundle:
    name: bundle validate
    runs-on: ubuntu-latest
    # `databricks bundle validate` is NOT a local, offline check. It calls the workspace's
    # SCIM /Me endpoint to resolve the current user before it resolves anything else, so it
    # fails without a reachable workspace and a valid token — it cannot be a gate on a repo
    # that has no workspace behind it.
    #
    # That is precisely why the DAG's invariants live in tests/test_bundle.py instead: those
    # parse the same YAML, run everywhere in under a second, and assert the things validate
    # does not check anyway — that retries are declared per task, that nothing runs without
    # a timeout, that only observability tasks may run after a failure, and that the run log
    # observes every task in its job.
    #
    # This job therefore runs only where credentials exist, and is a no-op otherwise rather
    # than a permanently red badge.
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate every target
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "No DATABRICKS_HOST secret configured; skipping."
            echo "The DAG invariants are covered by tests/test_bundle.py in the quality job."
            exit 0
          fi
          for target in dev qa prd; do
            echo "::group::$target"
            databricks bundle validate --target "$target"
            echo "::endgroup::"
          done
